project:
  name: rectified-flow-anime-v1.2-local-resume
  seed: 42

data:
  raw_dir: Data/train/nolabel
  split_dir: datasets/splits_v1_2
  image_size: 64
  train_ratio: 0.90
  val_ratio: 0.05
  test_ratio: 0.05
  remove_exact_duplicates: true
  remove_near_duplicates: true
  phash_size: 8
  phash_threshold: 4
  phash_crop_ratios: [0.9]
  split_seed: 42
  # 直接复用从 Colab 下载的相同清单，避免本地文件时间差触发重新划分。
  auto_prepare: false
  horizontal_flip: true
  num_workers: 4

model:
  in_channels: 3
  out_channels: 3
  base_channels: 64
  channel_multipliers: [1, 2, 4, 4]
  num_res_blocks: 2
  time_embedding_dim: 256
  dropout: 0.0

training:
  device: auto
  epochs: 100
  batch_size: 32
  learning_rate: 0.0002
  scheduler:
    name: cosine
    min_learning_rate: 0.000001
  ema_decay: 0.9999
  weight_decay: 0.0001
  mixed_precision: true
  gradient_clip: 1.0
  log_every_steps: 50
  validate_every_epochs: 1
  sample_every_epochs: 5
  save_every_epochs: 10
  resume: true

sampling:
  solver: heun
  num_steps: 50
  num_samples: 16
  trajectory_frames: 9
  trajectory_samples: 8

evaluation:
  preview_seed: 42
  validation_seed: 2026
  generation_seed: 2026
  metric_seed: 2026
  batch_size: 32
  calculate_fid: true
  calculate_kid: true
  kid_subsets: 50
  kid_subset_size: 500

paths:
  output_dir: outputs/v1_2
  checkpoint_dir: outputs/v1_2/checkpoints
  sample_dir: outputs/v1_2/samples
  plot_dir: outputs/v1_2/plots
  evaluation_dir: outputs/v1_2/evaluation
  log_dir: runs/rectified_flow_v1_2
